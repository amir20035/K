name: 💾 Large Youtube Videos Downloader

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube video URL'
        required: true
        type: string
      quality:
        description: 'Video quality (1080, 720, 480, audio)'
        required: false
        default: '1080'
        type: string
      password:
        description: 'Password for zip files (optional)'
        required: false
        default: ''
        type: string

jobs:
  download-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip curl jq bc
          pip3 install --upgrade yt-dlp

      - name: Download YouTube Video
        run: |
          URL="${{ github.event.inputs.youtube_url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          ZIP_PASSWORD="${{ github.event.inputs.password }}"

          SPLIT_MB=90
          BACKUP_DIR="/tmp/video_backup_$$"
          mkdir -p "$BACKUP_DIR"
          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          mkdir -p videos tmp_downloads

          echo "========================================="
          echo "YouTube Downloader"
          echo "========================================="
          echo "URL: $URL"
          echo "Quality: $QUALITY"

          # Set format based on quality
          case "$QUALITY" in
            "audio")
              FORMAT="bestaudio/best"
              ;;
            "1080")
              FORMAT="bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best"
              ;;
            "720")
              FORMAT="bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best"
              ;;
            "480")
              FORMAT="bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]/best"
              ;;
            *)
              FORMAT="bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]/best"
              ;;
          esac

          # Download with multiple fallback methods
          DOWNLOAD_SUCCESS=false

          # Method 1: Direct download
          echo "Method 1: Direct download..."
          if yt-dlp \
            --format "$FORMAT" \
            --merge-output-format mp4 \
            --output "tmp_downloads/%(title)s.%(ext)s" \
            --no-playlist \
            --retries 10 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "$URL"; then
            DOWNLOAD_SUCCESS=true
          fi

          # Method 2: With android client
          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "Method 2: Android client..."
            if yt-dlp \
              --extractor-args "youtube:player_client=android" \
              --format "$FORMAT" \
              --merge-output-format mp4 \
              --output "tmp_downloads/%(title)s.%(ext)s" \
              --no-playlist \
              --retries 15 \
              "$URL"; then
              DOWNLOAD_SUCCESS=true
            fi
          fi

          # Method 3: With iOS client
          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "Method 3: iOS client..."
            if yt-dlp \
              --extractor-args "youtube:player_client=ios" \
              --format "$FORMAT" \
              --merge-output-format mp4 \
              --output "tmp_downloads/%(title)s.%(ext)s" \
              --no-playlist \
              --retries 15 \
              "$URL"; then
              DOWNLOAD_SUCCESS=true
            fi
          fi

          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "❌ All download methods failed!"
            exit 1
          fi

          echo "✅ Download complete!"
          ls -la tmp_downloads/

          # ============================================
          # ZIP, SPLIT AND PREPARE FILES
          # ============================================

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          get_random_word() {
            WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon")
            echo "${WORDS[$RANDOM % ${#WORDS[@]}]}_$RANDOM"
          }

          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ] && [ ! -d "$BACKUP_DIR/$NAME" ]; then
              echo "$NAME"
              return
            fi
            local RANDOM_SUFFIX=$(get_random_word)
            while [ -d "$BASE_PATH/${NAME}_${RANDOM_SUFFIX}" ] || [ -d "$BACKUP_DIR/${NAME}_${RANDOM_SUFFIX}" ]; do
              RANDOM_SUFFIX=$(get_random_word)
            done
            echo "${NAME}_${RANDOM_SUFFIX}"
          }

          > /tmp/video_info.txt
          FILE_INDEX=0

          for FILE in tmp_downloads/*; do
            [ -f "$FILE" ] || continue
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            FILENAME_NO_EXT="${BASENAME%.*}"
            EXT="${BASENAME##*.}"
            FILE_INDEX=$((FILE_INDEX + 1))

            echo "Processing: $BASENAME ($(( SIZE / 1024 / 1024 ))MB)"

            FINAL_FOLDER_NAME=$(get_unique_folder "videos" "$FILENAME_NO_EXT" "true")
            mkdir -p "$BACKUP_DIR/${FINAL_FOLDER_NAME}"

            echo "${FILENAME_NO_EXT}|${FINAL_FOLDER_NAME}" >> /tmp/video_info.txt

            TEMP_NAME="video_${FILE_INDEX}"
            FOLDER_ENCODED=$(urlencode "${FINAL_FOLDER_NAME}")

            if [ "$SIZE" -gt $(( SPLIT_MB * 1024 * 1024 )) ]; then
              echo "  Splitting into ${SPLIT_MB}MB parts..."
              cp "$FILE" "tmp_downloads/${TEMP_NAME}.${EXT}"
              cd tmp_downloads
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -0 -s "${SPLIT_MB}m" -P "$ZIP_PASSWORD" "${TEMP_NAME}.zip" "${TEMP_NAME}.${EXT}"
              else
                zip -0 -s "${SPLIT_MB}m" "${TEMP_NAME}.zip" "${TEMP_NAME}.${EXT}"
              fi
              for part in ${TEMP_NAME}.z[0-9]* ${TEMP_NAME}.zip; do
                if [ -f "$part" ]; then
                  PART_EXT="${part##*.}"
                  mv "$part" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.${PART_EXT}"
                fi
              done
              rm -f "${TEMP_NAME}.${EXT}"
              cd ..
              PART_COUNT=$(ls "$BACKUP_DIR/${FINAL_FOLDER_NAME}/"*.z* 2>/dev/null | wc -l)
            else
              if [ -n "$ZIP_PASSWORD" ]; then
                echo "  Creating password-protected zip..."
                cd tmp_downloads
                zip -j -P "$ZIP_PASSWORD" "${TEMP_NAME}.zip" "${BASENAME}"
                mv "${TEMP_NAME}.zip" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.zip"
                cd ..
              else
                echo "  Copying file..."
                cp "$FILE" "$BACKUP_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.${EXT}"
              fi
            fi

            # Create README.md
            README_FILE="$BACKUP_DIR/${FINAL_FOLDER_NAME}/README.md"
            {
              echo "# ${FILENAME_NO_EXT}"
              echo ""
              echo "---"
              echo "## Video Information"
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| **Video Name** | \`${FILENAME_NO_EXT}\` |"
              echo "| **Original Link** | [YouTube Video](${URL}) |"
              echo "| **Quality** | **${QUALITY}** |"
              if [ -n "$ZIP_PASSWORD" ]; then
                echo "| **Password Protected** | **YES** |"
              else
                echo "| **Password Protected** | **NO** |"
              fi
              echo ""
              echo "---"
              echo "*Powered by HASSANAHANI.ir*"
            } > "$README_FILE"
          done

          rm -rf tmp_downloads

      - name: Incremental Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)

          echo "Starting incremental push..."

          # Sync with remote
          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"

          # Copy backup files
          mkdir -p videos
          cp -r "$BACKUP_DIR"/* videos/

          # Function to regenerate master README
          regenerate_master_readme() {
            MASTER_README="videos/README.md"
            {
              echo "# 📥 Downloaded Videos"
              echo ""
              echo "---"
            } > "$MASTER_README"
            
            NUM=0
            for folder in videos/*/; do
              [ -d "$folder" ] || continue
              [ -f "$folder/README.md" ] || continue
              NUM=$((NUM + 1))
              FOLDER_NAME=$(basename "$folder")
              FOLDER_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$FOLDER_NAME'))")
              echo "$NUM. 🎬 [${FOLDER_NAME}](https://github.com/${REPO_OWNER}/${REPO_NAME}/tree/${BRANCH}/videos/${FOLDER_ENCODED})" >> "$MASTER_README"
            done
          }

          # Push files in batches
          git add videos/
          regenerate_master_readme
          git add videos/README.md

          if ! git diff --cached --quiet; then
            git commit -m "[HASSANAHANI] YouTube download [skip ci]"
            
            # Push with retries
            for i in {1..10}; do
              if git push origin HEAD:"$BRANCH"; then
                echo "✅ Push successful!"
                break
              fi
              echo "Push failed, retry $i/10..."
              git fetch origin "$BRANCH"
              git reset --hard origin/"$BRANCH"
              mkdir -p videos
              cp -r "$BACKUP_DIR"/* videos/
              git add videos/
              regenerate_master_readme
              git add videos/README.md
              git commit -m "[HASSANAHANI] YouTube download [skip ci]" || true
              sleep 5
            done
          fi

          echo "✅ All done!"
